name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Tests
        continue-on-error: true   # звуковые тесты на раннере без аудиоустройств могут вести себя иначе
        run: python -m pytest -q

      - name: Build exe
        run: pyinstaller --noconfirm --clean glitchmind.spec

      - name: Self-test of the built exe
        shell: pwsh
        run: |
          Start-Process -FilePath dist\GlitchMind\GlitchMind.exe -ArgumentList "--selftest" -Wait
          Get-Content dist\GlitchMind\selftest.txt
          if (Select-String -Path dist\GlitchMind\selftest.txt -Pattern "^FAIL") { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: GlitchMind-windows
          path: dist/GlitchMind
